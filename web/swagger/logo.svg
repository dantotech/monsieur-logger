<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Monsieur Logger</title>
  <defs>
    <clipPath id="badge"><circle cx="256" cy="256" r="240"/></clipPath>
    <pattern id="stripes" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#ffffff"/>
      <rect y="0" width="24" height="11" fill="#1d3a8a"/>
    </pattern>
  </defs>

  <!-- tricolore badge -->
  <g clip-path="url(#badge)">
    <rect x="0" y="0" width="171" height="512" fill="#0055a4"/>
    <rect x="171" y="0" width="170" height="512" fill="#f4f1ea"/>
    <rect x="341" y="0" width="171" height="512" fill="#ef4135"/>
    <!-- tiny Eiffel tower in the background -->
    <g fill="none" stroke="#c9c2b2" stroke-width="5" stroke-linejoin="round" opacity="0.9">
      <path d="M402 330 L432 120 L462 330"/>
      <path d="M412 262 H452 M420 200 H444 M426 160 H438"/>
      <path d="M402 330 Q432 280 462 330"/>
      <line x1="432" y1="120" x2="432" y2="100"/>
    </g>
    <!-- ground -->
    <rect x="0" y="430" width="512" height="90" fill="#6b8e3a"/>
    <!-- body: mariniere -->
    <path d="M150 512 L162 360 Q170 318 256 312 Q342 318 350 360 L362 512 Z" fill="url(#stripes)" stroke="#1b1b1b" stroke-width="6"/>
    <!-- red neckerchief -->
    <path d="M220 318 L256 352 L292 318 Z" fill="#ef4135" stroke="#1b1b1b" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- the log (wooden) -->
  <g stroke="#1b1b1b" stroke-width="6" transform="translate(0 -34)">
    <rect x="70" y="400" width="200" height="66" rx="16" fill="#9a5b2c"/>
    <ellipse cx="270" cy="433" rx="24" ry="33" fill="#e2b77c"/>
    <ellipse cx="270" cy="433" rx="13" ry="19" fill="none" stroke="#b07a43" stroke-width="4"/>
    <ellipse cx="270" cy="433" rx="4" ry="7" fill="#b07a43" stroke="none"/>
    <path d="M100 418 H180 M120 448 H230" stroke="#6e3e1b" stroke-width="5" fill="none"/>
  </g>
  <!-- wood chips flying -->
  <g fill="#e2b77c" stroke="#1b1b1b" stroke-width="3" transform="translate(0 -20)">
    <path d="M140 372 l14 -6 l4 10 l-14 6 Z"/>
    <path d="M104 384 l10 -10 l7 7 l-10 10 Z"/>
    <path d="M186 366 l12 2 l-2 10 l-12 -2 Z"/>
  </g>

  <!-- head -->
  <circle cx="256" cy="230" r="80" fill="#f6c9a0" stroke="#1b1b1b" stroke-width="6"/>
  <!-- rosy cheeks -->
  <circle cx="208" cy="250" r="13" fill="#f29b8b" opacity="0.7"/>
  <circle cx="304" cy="250" r="13" fill="#f29b8b" opacity="0.7"/>
  <!-- eyes: one winking -->
  <circle cx="226" cy="214" r="9" fill="#1b1b1b"/>
  <circle cx="229" cy="211" r="3" fill="#ffffff"/>
  <path d="M276 216 Q288 206 300 216" fill="none" stroke="#1b1b1b" stroke-width="6" stroke-linecap="round"/>
  <!-- eyebrows -->
  <path d="M210 192 Q226 182 242 190" fill="none" stroke="#1b1b1b" stroke-width="6" stroke-linecap="round"/>
  <path d="M272 190 Q288 182 304 194" fill="none" stroke="#1b1b1b" stroke-width="6" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M256 222 Q270 246 252 252" fill="#f0b48a" stroke="#1b1b1b" stroke-width="5" stroke-linecap="round"/>
  <!-- grand curly moustache -->
  <path d="M256 262
           C238 252 214 252 200 266
           C190 276 176 276 172 262
           C170 284 196 292 214 282
           C230 274 246 272 256 276
           C266 272 282 274 298 282
           C316 292 342 284 340 262
           C336 276 322 276 312 266
           C298 252 274 252 256 262 Z"
        fill="#3b2314" stroke="#1b1b1b" stroke-width="4" stroke-linejoin="round"/>
  <!-- smile -->
  <path d="M238 290 Q256 302 274 290" fill="none" stroke="#1b1b1b" stroke-width="5" stroke-linecap="round"/>

  <!-- beret -->
  <path d="M168 180 Q170 120 256 116 Q350 114 352 172 Q330 160 256 160 Q196 160 168 180 Z"
        fill="#1b1b1b"/>
  <ellipse cx="258" cy="164" rx="94" ry="14" fill="#2b2b2b"/>
  <path d="M256 117 q4 -18 16 -20" fill="none" stroke="#1b1b1b" stroke-width="7" stroke-linecap="round"/>

  <!-- arms + baguette "axe" raised over the log -->
  <path d="M190 360 Q150 350 130 318" fill="none" stroke="#1b1b1b" stroke-width="30" stroke-linecap="round"/>
  <path d="M190 360 Q150 350 130 318" fill="none" stroke="#f6c9a0" stroke-width="20" stroke-linecap="round"/>
  <g transform="rotate(55 128 312)">
    <rect x="-40" y="293" width="190" height="38" rx="19" fill="#e0a458" stroke="#1b1b1b" stroke-width="6"/>
    <path d="M-10 303 l14 18 M28 303 l14 18 M66 303 l14 18 M104 303 l14 18"
          stroke="#a8682a" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
  <circle cx="128" cy="312" r="16" fill="#f6c9a0" stroke="#1b1b1b" stroke-width="5"/>

  <!-- badge ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#1b1b1b" stroke-width="12"/>

  <!-- banner -->
  <g>
    <path d="M86 470 L426 470 L410 500 L426 530 L86 530 L102 500 Z" fill="#ffffff" stroke="#1b1b1b" stroke-width="6" transform="translate(0 -42)"/>
    <text x="256" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="34" font-weight="bold" fill="#1b1b1b">Monsieur Logger</text>
  </g>
</svg>
