<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Monsieur Logger - Swagger UI</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    body { margin: 0; }
    .ml-header { display: flex; align-items: center; gap: 16px; padding: 12px 24px;
      background: linear-gradient(90deg, #0055a4 0 33%, #ffffff 33% 66%, #ef4135 66%); }
    .ml-header img { height: 72px; background: #fff; border-radius: 50%; padding: 4px; }
    .ml-header h1 { font-family: Georgia, serif; margin: 0; color: #1b1b1b;
      background: rgba(255,255,255,.85); padding: 4px 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="ml-header">
    <img src="logo.svg" alt="Monsieur Logger logo">
    <h1>Monsieur Logger</h1>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
  <script>
    window.ui = SwaggerUIBundle({ url: 'openapi.yaml', dom_id: '#swagger-ui', deepLinking: true });
  </script>
</body>
</html>
